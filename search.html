<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — MUSE RTD Cocktails</title>
  <link rel="preconnect" href="https://p.typekit.net">
  <link rel="stylesheet" href="assets/fonts/font.css">

</head>
<body style="margin:0;background:#FBF6EE;font-family:'neuehaasdisplaylight','Helvetica Neue',Arial,sans-serif;">

  <!-- ════ FIXED NAV ════════════════════════════════════════════════════════ -->
  <div id="site-nav-host"></div>
  <!-- ════ END NAV ══════════════════════════════════════════════════════════ -->

  <!-- ════ SEARCH RESULTS PAGE ════════════════════════════════════════════ -->
  <main style="padding-top:80px;min-height:100vh;background:#FBF6EE;">
    <div style="max-width:760px;margin:0 auto;padding:clamp(48px,7vw,96px) 24px 80px;">

      <!-- Header -->
      <div style="margin-bottom:40px;">
        <div style="font-size:10px;letter-spacing:.26em;font-weight:600;color:#9A8F7C;margin-bottom:18px;">SEARCH</div>
        <!-- Search input bar -->
        <div style="display:flex;align-items:center;gap:14px;border-bottom:2px solid #0A0B0C;padding-bottom:12px;margin-bottom:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0B0C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:none;opacity:.5;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-page-input" type="text" placeholder="Search MUSE…" autocomplete="off"
            style="flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:clamp(22px,3vw,34px);letter-spacing:.04em;color:#0A0B0C;font-weight:300;">
          <button id="search-page-clear" onclick="clearSearch()" style="display:none;background:none;border:none;cursor:pointer;padding:4px;opacity:.45;" aria-label="Clear">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0B0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div id="search-page-meta" style="font-size:11px;letter-spacing:.1em;color:#9A8F7C;min-height:18px;"></div>
      </div>

      <!-- Results -->
      <div id="search-page-results"></div>

    </div>
  </main>

  <div id="site-footer"></div>

<script src="assets/js/cart-ui.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/nav.js"></script>
<script src="search-ui.js"></script>
<script>
(function(){
  var input=document.getElementById('search-page-input');
  var meta=document.getElementById('search-page-meta');
  var results=document.getElementById('search-page-results');
  var clearBtn=document.getElementById('search-page-clear');

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  function score(item,terms){
    var text=(item.title+' '+item.description+' '+item.content).toLowerCase();
    var s=0;
    terms.forEach(function(t){
      if(item.title.toLowerCase().indexOf(t)!==-1)s+=3;
      else if(item.description.toLowerCase().indexOf(t)!==-1)s+=2;
      else if(text.indexOf(t)!==-1)s+=1;
    });
    return s;
  }

  function render(q,data){
    clearBtn.style.display=q?'flex':'none';
    if(!q){
      meta.textContent='';
      results.innerHTML='';
      return;
    }
    var terms=q.toLowerCase().split(/\s+/).filter(Boolean);
    var hits=data.map(function(item){return{item:item,s:score(item,terms)};})
      .filter(function(x){return x.s>0;})
      .sort(function(a,b){return b.s-a.s;})
      .map(function(x){return x.item;});

    if(!hits.length){
      meta.textContent='No results';
      results.innerHTML='<div style="padding:48px 0;text-align:center;">'
        +'<div style="font-size:12px;letter-spacing:.16em;color:#9A8F7C;margin-bottom:12px;">NO RESULTS FOR</div>'
        +'<div style="font-family:\'Ogg\',\'Cormorant Garamond\',Georgia,serif;font-size:clamp(24px,3.5vw,40px);font-weight:300;color:#0A0B0C;margin-bottom:28px;">"'+esc(q)+'"</div>'
        +'<a href="shop.html" style="display:inline-block;background:#EFA527;color:#0A0B0C;border-radius:30px;padding:12px 28px;font-size:11px;letter-spacing:.18em;font-weight:600;text-decoration:none;">SHOP ALL PRODUCTS</a>'
        +'</div>';
      return;
    }

    meta.textContent=hits.length+' result'+(hits.length===1?'':'s')+' for "'+q+'"';
    results.innerHTML=hits.map(function(h,i){
      return '<a href="'+h.url+'" style="display:flex;align-items:center;gap:20px;padding:22px 0;text-decoration:none;color:#0A0B0C;border-bottom:1px solid #E7DAC4;'+(i===0?'border-top:1px solid #E7DAC4;':'')+'">'
        +'<div style="flex:1;">'
        +'<div style="font-size:11px;letter-spacing:.22em;font-weight:600;margin-bottom:5px;color:#0A0B0C;">'+esc(h.title)+'</div>'
        +'<div style="font-size:13px;letter-spacing:.04em;color:#5A5040;line-height:1.5;">'+esc(h.description)+'</div>'
        +'<div style="font-size:10px;letter-spacing:.1em;color:#C9851A;margin-top:6px;">'+esc(h.url)+'</div>'
        +'</div>'
        +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:none;opacity:.35;"><path d="m9 18 6-6-6-6"/></svg>'
        +'</a>';
    }).join('');
  }

  var indexCache=null;
  function run(){
    var q=input.value.trim();
    if(!indexCache){
      fetch('search-index.json').then(function(r){return r.json();}).then(function(d){indexCache=d;render(q,d);}).catch(function(){render(q,[]);});
    } else {
      render(q,indexCache);
    }
    var url=new URL(window.location);
    if(q)url.searchParams.set('q',q); else url.searchParams.delete('q');
    history.replaceState(null,'',url);
  }

  function clearSearch(){input.value='';run();input.focus();}

  input.addEventListener('input',run);
  input.addEventListener('keydown',function(e){if(e.key==='Escape')input.blur();});

  // Pre-fill from URL ?q=
  var params=new URLSearchParams(window.location.search);
  var q0=params.get('q');
  if(q0){input.value=q0;run();}
})();
</script>
</body>
</html>
